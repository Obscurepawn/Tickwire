<svg xmlns="http://www.w3.org/2000/svg" width="780" height="618" viewBox="0 0 780 618"
     role="img" aria-labelledby="title description">
  <title id="title">Stateless ultra-low-latency order lifecycle across REQ, LinkOps, and RESP</title>
  <desc id="description">Stateless order lifecycle: 1024-byte Strategy IntentRecord enters REQ on req_cpu through the 23-microsecond stale gate, flat RmsEngine, lock-free atomic BBO OrsStpBook::self_cross, PublishedRoutes::pick (OrderRouter 9/8 EWMA) selection with SharedRateLimiter local_ip and account quotas, and LinkOps wire send without overlapping Order and Connection spinlocks; Venue replies enter RESP on resp_cpu via single-pass JsonScan into distinct One ack (FrontAck or Ack), ProjectedFill, and FillRecordPool (Fill trade deduplication plus amendment = true fee patch) facts, OrsQueryDesk doubt recovery on cold housekeeping_cpus, and immediate SlotState::Retired slot reclamation plus OrsStpBook unlink without waiting on fee_reconciled.</desc>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#4338ca"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "DejaVu Sans", sans-serif; text-anchor: middle; }
      .band-h-req { font-size: 15.2px; font-weight: 700; fill: #1e3a8a; }
      .band-h-resp { font-size: 15.2px; font-weight: 700; fill: #115e59; }
      .step-req { font-size: 13.2px; font-weight: 700; fill: #1d4ed8; }
      .step-resp { font-size: 13.2px; font-weight: 700; fill: #0f766e; }
      .box-title { font-size: 14.2px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-size: 13px; fill: #334155; }
      .pill-green-txt { font-size: 13px; font-weight: 700; fill: #15803d; }
      .pill-blue-txt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
      .out-title-ok { font-size: 14.8px; font-weight: 700; fill: #14532d; }
      .out-title-amber { font-size: 14.8px; font-weight: 700; fill: #78350f; }
      .out-title-indigo { font-size: 14.8px; font-weight: 700; fill: #312e81; }
      .out-sub { font-size: 13px; fill: #1e293b; }
      .out-foot-ok { font-size: 12.8px; font-weight: 700; fill: #15803d; }
      .out-foot-amber { font-size: 12.8px; font-weight: 700; fill: #b45309; }
      .out-foot-indigo { font-size: 12.8px; font-weight: 700; fill: #4338ca; }
      .band-req { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; }
      .band-resp { fill: #f8fafc; stroke: #0d9488; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; }
      .card-wire { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .card-retire { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
      .out-ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
      .out-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
      .out-indigo { fill: #f5f3ff; stroke: #6366f1; stroke-width: 1.8; stroke-dasharray: 6 3; }
      .pill-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.4; }
      .pill-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; }
      .div-ok { stroke: #86efac; stroke-width: 1.2; }
      .div-amber { stroke: #fcd34d; stroke-width: 1.2; }
      .div-indigo { stroke: #c7d2fe; stroke-width: 1.2; }
      .line-dark { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linejoin: round; }
      .line-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-linejoin: round; }
      .line-ok { fill: none; stroke: #15803d; stroke-width: 2.2; stroke-linejoin: round; }
      .line-amber { fill: none; stroke: #b45309; stroke-width: 2.2; stroke-linejoin: round; }
      .line-indigo { fill: none; stroke: #4338ca; stroke-width: 2.1; stroke-dasharray: 5 3.5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="780" height="618" rx="10" fill="#ffffff"/>

  <!-- Band 1: REQ Spin Thread (req_cpu) Outbound Pipeline -->
  <rect class="band-req" x="14" y="14" width="752" height="158" rx="9"/>
  <text x="390" y="38" class="band-h-req">REQ Spin Thread (req_cpu) — Outbound Intent Admission, Routing &amp; Wire Send</text>

  <!-- Stage 1 -->
  <rect class="card" x="28" y="50" width="230" height="108" rx="7"/>
  <text x="143" y="72" class="step-req">1 · INTENT &amp; 23 µs GATE</text>
  <text x="143" y="95" class="box-title">Strategy Intent 1024B</text>
  <text x="143" y="117" class="box-sub">23 µs stale gate · tw1... ID</text>
  <text x="143" y="139" class="box-sub">Flat RmsEngine (1s/5s/10s)</text>

  <path class="line-dark" d="M258 104 H272" marker-end="url(#arr-dark)"/>

  <!-- Stage 2 -->
  <rect class="card" x="275" y="50" width="230" height="108" rx="7"/>
  <text x="390" y="72" class="step-req">2 · ATOMIC STP &amp; ROUTER</text>
  <text x="390" y="95" class="box-title">OrsStpBook::self_cross</text>
  <text x="390" y="117" class="box-sub">Lock-free atomic BBO read</text>
  <text x="390" y="139" class="box-sub">PublishedRoutes::pick (9/8)</text>

  <path class="line-blue" d="M505 104 H519" marker-end="url(#arr-blue)"/>

  <!-- Stage 3 -->
  <rect class="card-wire" x="522" y="50" width="230" height="108" rx="7"/>
  <text x="637" y="72" class="step-req">3 · QUOTA &amp; LINKOPS SEND</text>
  <text x="637" y="95" class="box-title">SharedRateLimiter + Wire</text>
  <text x="637" y="117" class="box-sub">local_ip + account quotas</text>
  <text x="637" y="139" class="box-sub">LinkOps WS / HTTPS / FIX</text>

  <!-- Corridor between REQ and RESP -->
  <path class="line-ok" d="M143 158 V180" marker-end="url(#arr-green)"/>
  <path class="line-ok" d="M390 158 V180" marker-end="url(#arr-green)"/>
  <rect class="pill-ok" x="28" y="183" width="448" height="31" rx="15.5"/>
  <text x="252" y="203" class="pill-green-txt">0-Byte Gate / RMS / STP / Quota Reject -&gt; Release Hold</text>

  <path class="line-blue" d="M637 158 V225" marker-end="url(#arr-blue)"/>
  <rect class="pill-blue" x="490" y="183" width="262" height="31" rx="15.5"/>
  <text x="621" y="203" class="pill-blue-txt">Venue Wire Replies &amp; Executions</text>

  <!-- Band 2: RESP Epoll Thread (resp_cpu) Inbound Decode & Slot Retirement -->
  <rect class="band-resp" x="14" y="228" width="752" height="158" rx="9"/>
  <text x="390" y="252" class="band-h-resp">RESP Epoll Thread (resp_cpu) — Single-Pass Decode, Fills &amp; Immediate Retirement</text>

  <!-- Stage 4 -->
  <rect class="card" x="28" y="264" width="230" height="108" rx="7"/>
  <text x="143" y="286" class="step-resp">4 · JSONSCAN &amp; ONE ACK</text>
  <text x="143" y="309" class="box-title">Single-Pass JsonScan</text>
  <text x="143" y="331" class="box-sub">One ack: FrontAck / Ack</text>
  <text x="143" y="353" class="box-sub">Link resting in OrsStpBook</text>

  <path class="line-dark" d="M258 318 H272" marker-end="url(#arr-dark)"/>

  <!-- Stage 5 -->
  <rect class="card" x="275" y="264" width="230" height="108" rx="7"/>
  <text x="390" y="286" class="step-resp">5 · PROJECTEDFILL &amp; FILLS</text>
  <text x="390" y="309" class="box-title">FillRecordPool Dedup</text>
  <text x="390" y="331" class="box-sub">ProjectedFill status delta</text>
  <text x="390" y="353" class="box-sub">Fill + amendment = true fee</text>

  <path class="line-ok" d="M505 318 H519" marker-end="url(#arr-green)"/>

  <!-- Stage 6 -->
  <rect class="card-retire" x="522" y="264" width="230" height="108" rx="7"/>
  <text x="637" y="286" class="step-resp">6 · IMMEDIATE RETIRE</text>
  <text x="637" y="309" class="box-title">Unlink OrsStpBook &amp; Retire</text>
  <text x="637" y="331" class="box-sub">Immediate SlotState::Retired</text>
  <text x="637" y="353" class="box-sub">No wait on fee_reconciled</text>

  <!-- Bottom Branches to 3 Outcome / Recovery Boundaries -->
  <path class="line-ok" d="M143 386 V429" marker-end="url(#arr-green)"/>
  <path class="line-amber" d="M390 386 V429" marker-end="url(#arr-amber)"/>
  <path class="line-indigo" d="M637 386 V429" marker-end="url(#arr-indigo)"/>

  <!-- Outcome 1: ReportRecord SHM Replies & Post-Retire Fee Amendments -->
  <rect class="out-ok" x="14" y="432" width="242" height="170" rx="8"/>
  <text x="135" y="459" class="out-title-ok">ReportRecord SHM (512B)</text>
  <line class="div-ok" x1="30" y1="472" x2="240" y2="472"/>
  <text x="135" y="497" class="out-sub">Distinct FrontAck / Ack,</text>
  <text x="135" y="518" class="out-sub">ProjectedFill, and Fill facts</text>
  <text x="135" y="544" class="out-sub">Late amendment = true updates</text>
  <text x="135" y="565" class="out-sub">FillRecordPool after Retired</text>
  <text x="135" y="590" class="out-foot-ok">Zero stall on fee_reconciled</text>

  <!-- Outcome 2: Per-Order OrsQueryDesk Doubt Recovery -->
  <rect class="out-amber" x="269" y="432" width="242" height="170" rx="8"/>
  <text x="390" y="459" class="out-title-amber">OrsQueryDesk Recovery</text>
  <line class="div-amber" x1="285" y1="472" x2="495" y2="472"/>
  <text x="390" y="497" class="out-sub">Timeout / 5xx / disconnect</text>
  <text x="390" y="518" class="out-sub">isolates single InDoubt order</text>
  <text x="390" y="544" class="out-sub">Cold housekeeping_cpus</text>
  <text x="390" y="565" class="out-sub">AsyncRestQuerier probe</text>
  <text x="390" y="590" class="out-foot-amber">Peer orders keep trading</text>

  <!-- Outcome 3: Stateless Exchange Snapshot Bootstrap -->
  <rect class="out-indigo" x="524" y="432" width="242" height="170" rx="8"/>
  <text x="645" y="459" class="out-title-indigo">Cold REST + tw1... Boot</text>
  <line class="div-indigo" x1="540" y1="472" x2="750" y2="472"/>
  <text x="645" y="497" class="out-sub">Stateless Exchange REST</text>
  <text x="645" y="518" class="out-sub">Account + OpenOrders scan</text>
  <text x="645" y="544" class="out-sub">Verify tw1... MAC attribution</text>
  <text x="645" y="565" class="out-sub">&amp; per-strategy seq floors</text>
  <text x="645" y="590" class="out-foot-indigo">Zero disk WAL or local state</text>
</svg>
