<svg xmlns="http://www.w3.org/2000/svg" width="760" height="996" viewBox="0 0 760 996"
     role="img" aria-labelledby="title description">
  <title id="title">Tickwire stateless 3-process Linux shared-memory architecture</title>
  <desc id="description">Stateless 3-process Linux shared-memory trading architecture: tickwire-md decodes public venue feeds on hot reactor_cpu with cold md-cold housekeeping_cpus into a memfd-sealed SPMC market ring; 1..M tickwire-strategy-worker processes on worker_cpu consume independent market cursors and exchange inline 1024-byte IntentRecord and 512-byte ReportRecord SPSC shared-memory rings plus DOP Unix socket bootstrap with a unified per-venue ORS process hosting 1..N multi-UID AccountSessions, disjoint REQ spin (req_cpu) and RESP epoll (resp_cpu) hot threads, SharedRateLimiter, LinkOps WS/HTTPS/FIX with SO_BINDTODEVICE, and cold housekeeping_cpus Dialer, AsyncRestQuerier/OrsQueryDesk, LatencyTracer, SignalWaiter, and Exchange REST tw1 bootstrap.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#4f46e5"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "DejaVu Sans", sans-serif; text-anchor: middle; }
      .h-ext { font-size: 16.5px; font-weight: 700; fill: #f8fafc; }
      .sub-ext { font-size: 13.2px; fill: #cbd5e1; }
      .h-proc { font-size: 16.5px; font-weight: 700; fill: #0f172a; }
      .sub-proc { font-size: 13.2px; fill: #475569; }
      .h-mod { font-size: 14.8px; font-weight: 700; fill: #0f172a; }
      .h-hot-blue { font-size: 14.8px; font-weight: 700; fill: #1e3a8a; }
      .h-hot-teal { font-size: 14.8px; font-weight: 700; fill: #115e59; }
      .h-async { font-size: 14.5px; font-weight: 700; fill: #312e81; }
      .sub-mod { font-size: 13px; fill: #334155; }
      .cpu-hot { font-size: 13.2px; font-weight: 700; fill: #1e3a8a; }
      .cpu-cold { font-size: 13.2px; font-weight: 700; fill: #312e81; }
      .ring-lbl { font-size: 14.5px; font-weight: 700; fill: #115e59; }
      .edge-lbl { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .edge-blue { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
      .edge-teal { font-size: 13px; font-weight: 700; fill: #0f766e; }
      .edge-indigo { font-size: 13px; font-weight: 700; fill: #3730a3; }
      .edge-sub { font-size: 12.6px; fill: #334155; }
      .ext-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1.6; }
      .proc-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .shm-box { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; stroke-dasharray: 6 3; }
      .badge-hot { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .badge-cold { fill: #f5f3ff; stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .mod-req { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .mod-resp { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; }
      .mod-link { fill: #ffffff; stroke: #64748b; stroke-width: 1.7; }
      .mod-async { fill: #f5f3ff; stroke: #6366f1; stroke-width: 1.8; stroke-dasharray: 6 3.5; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .pill-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.3; }
      .pill-teal { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.3; }
      .pill-indigo { fill: #f5f3ff; stroke: #c7d2fe; stroke-width: 1.3; }
      .wire-slate { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-teal { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-teal-dash { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 5 3.5; stroke-linejoin: round; }
      .wire-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-async { fill: none; stroke: #4f46e5; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="760" height="996" rx="10" fill="#ffffff"/>

  <!-- 1. External Venue Public Feeds -->
  <rect class="ext-box" x="130" y="16" width="500" height="58" rx="8"/>
  <text x="380" y="40" class="h-ext">Venue Public Market Feeds</text>
  <text x="380" y="61" class="sub-ext">WebSocket · HTTPS Depth Snapshot · Spot SBE</text>

  <path class="wire-slate" d="M380 74 V109" marker-end="url(#arrow-slate)"/>
  <rect class="pill" x="394" y="80" width="184" height="26" rx="13"/>
  <text x="486" y="98" class="edge-lbl">Public wire frames</text>

  <!-- 2. Process 1: tickwire-md -->
  <rect class="proc-box" x="28" y="112" width="704" height="142" rx="8"/>
  <text x="380" y="139" class="h-proc">1 · tickwire-md (Market-Data Publisher)</text>
  <text x="380" y="160" class="sub-proc">Single-writer tick/lot decode · sequence continuity · bounded RAM JOIN</text>

  <rect class="badge-hot" x="48" y="170" width="322" height="30" rx="6"/>
  <text x="209" y="190" class="cpu-hot">Hot: reactor_cpu (feed + ring)</text>

  <rect class="badge-cold" x="390" y="170" width="322" height="30" rx="6"/>
  <text x="551" y="190" class="cpu-cold">Cold: md-cold · housekeeping_cpus</text>

  <rect class="shm-box" x="48" y="208" width="664" height="36" rx="6"/>
  <text x="380" y="231" class="ring-lbl">Sealed SPMC SHM Market Ring (memfd + book snapshot)</text>

  <!-- Fan-out from SHM Market Ring to 1..M Strategy Workers ONLY -->
  <path class="wire-teal" d="M196 244 V311" marker-end="url(#arrow-teal)"/>
  <path class="wire-teal" d="M564 244 V311" marker-end="url(#arrow-teal)"/>
  <rect class="pill-teal" x="224" y="265" width="312" height="28" rx="14"/>
  <text x="380" y="284" class="edge-teal">Independent SHM cursors · JOIN</text>

  <!-- 3. Process 2: 1..M tickwire-strategy-worker Processes -->
  <rect class="proc-box" x="20" y="314" width="350" height="112" rx="8"/>
  <text x="195" y="341" class="h-proc">2 · tickwire-strategy-worker 1</text>
  <text x="195" y="365" class="cpu-hot">worker_cpu · housekeeping_cpus</text>
  <text x="195" y="388" class="sub-proc">Private algo state · Cursor 1</text>
  <text x="195" y="410" class="sub-proc">Sealed ELF · cgroup v2 · 0 disk I/O</text>

  <rect class="proc-box" x="390" y="314" width="350" height="112" rx="8"/>
  <text x="565" y="341" class="h-proc">2 · tickwire-strategy-worker M</text>
  <text x="565" y="365" class="cpu-hot">worker_cpu · housekeeping_cpus</text>
  <text x="565" y="388" class="sub-proc">Private algo state · Cursor M</text>
  <text x="565" y="410" class="sub-proc">account_ref = 0 | 1..255</text>

  <!-- Corridor: Inline IntentRecord (1024B) / ReportRecord (512B) SHM Rings + DOP Socket -->
  <path class="wire-blue" d="M136 426 V515" marker-end="url(#arrow-blue)"/>
  <path class="wire-teal-dash" d="M380 429 V515" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <path class="wire-slate" d="M624 518 V429" marker-end="url(#arrow-slate)"/>

  <rect class="pill-blue" x="20" y="446" width="234" height="50" rx="8"/>
  <text x="137" y="467" class="edge-blue">IntentRecord SHM (1024B)</text>
  <text x="137" y="486" class="edge-sub">Inline New · Modify · Cancel</text>

  <rect class="pill-teal" x="264" y="446" width="232" height="50" rx="8"/>
  <text x="380" y="467" class="edge-teal">DOP Unix Control Socket</text>
  <text x="380" y="486" class="edge-sub">SCM_RIGHTS memfd attach</text>

  <rect class="pill" x="506" y="446" width="234" height="50" rx="8"/>
  <text x="623" y="467" class="edge-lbl">ReportRecord SHM (512B)</text>
  <text x="623" y="486" class="edge-sub">One ack · ProjectedFill · Fill</text>

  <!-- 4. Process 3: Unified Venue ORS Process -->
  <rect class="proc-box" x="16" y="518" width="728" height="336" rx="10"/>
  <text x="380" y="544" class="h-proc">3 · Unified Venue ORS Process (1 ORS = 1 Venue)</text>
  <text x="380" y="564" class="sub-proc">1..N Multi-UID AccountSessions (account_ref 1..255) · Zero MD Feeds</text>
  <text x="380" y="582" class="sub-proc">Multi-wallet AssetKey { wallet_id, asset_id } · Non-overlapping spinlocks</text>

  <!-- Hot Core 1: REQ Spin Thread -->
  <rect class="mod-req" x="32" y="596" width="338" height="112" rx="6"/>
  <text x="201" y="620" class="h-hot-blue">REQ Spin Thread (req_cpu)</text>
  <text x="201" y="643" class="sub-mod">23 µs stale gate · Flat RmsEngine</text>
  <text x="201" y="665" class="sub-mod">Atomic BBO StpBook::self_cross</text>
  <text x="201" y="687" class="sub-mod">OrderRouter::pick (9/8 EWMA) · tw1...</text>

  <!-- Hot Core 2: RESP Epoll Thread -->
  <rect class="mod-resp" x="390" y="596" width="338" height="112" rx="6"/>
  <text x="559" y="620" class="h-hot-teal">RESP Epoll Thread (resp_cpu)</text>
  <text x="559" y="643" class="sub-mod">epoll_wait_ms = 0 · Single-pass JsonScan</text>
  <text x="559" y="665" class="sub-mod">One ack (FrontAck/Ack) · ProjectedFill</text>
  <text x="559" y="687" class="sub-mod">FillRecordPool (amendment) · RETIRED</text>

  <!-- Internal ORS Handoffs -->
  <path class="wire-blue" d="M201 708 V721" marker-end="url(#arrow-blue)"/>
  <path class="wire-slate" d="M312 724 V716 H448 V711" marker-end="url(#arrow-slate)"/>
  <path class="wire-async" d="M559 724 V711" marker-end="url(#arrow-indigo)"/>

  <!-- Shared RateLimiter + LinkOps Wire Plane -->
  <rect class="mod-link" x="32" y="724" width="338" height="114" rx="6"/>
  <text x="201" y="748" class="h-mod">SharedRateLimiter &amp; LinkOps</text>
  <text x="201" y="771" class="sub-mod">Atomic local_ip + UID quota gates</text>
  <text x="201" y="793" class="sub-mod">WS / HTTPS / FIX + SO_BINDTODEVICE</text>
  <text x="201" y="815" class="sub-mod">OrderRoute.product_mask pools</text>

  <!-- Cold Housekeeping Actors -->
  <rect class="mod-async" x="390" y="724" width="338" height="114" rx="6"/>
  <text x="559" y="748" class="h-async">Cold housekeeping_cpus (Disjoint)</text>
  <text x="559" y="771" class="sub-mod">Dialer (DNS + TLS) · SignalWaiter</text>
  <text x="559" y="793" class="sub-mod">AsyncRestQuerier / OrsQueryDesk</text>
  <text x="559" y="815" class="sub-mod">LatencyTracer · Cold REST tw1... boot</text>

  <!-- Venue Wire Corridor -->
  <path class="wire-blue" d="M150 854 V921" marker-end="url(#arrow-blue)"/>
  <path class="wire-async" d="M380 924 V857" marker-end="url(#arrow-indigo)"/>
  <path class="wire-slate" d="M610 924 V857" marker-end="url(#arrow-slate)"/>

  <rect class="pill-blue" x="24" y="866" width="252" height="46" rx="8"/>
  <text x="150" y="886" class="edge-blue">LinkOps WS / HTTPS / FIX</text>
  <text x="150" y="904" class="edge-sub">Multi-IP + SO_BINDTODEVICE</text>

  <rect class="pill-indigo" x="286" y="866" width="188" height="46" rx="8"/>
  <text x="380" y="886" class="edge-indigo">Cold REST Snapshot</text>
  <text x="380" y="904" class="edge-sub">Account + OpenOrders</text>

  <rect class="pill" x="484" y="866" width="252" height="46" rx="8"/>
  <text x="610" y="886" class="edge-lbl">Acks · Fills · Amendments</text>
  <text x="610" y="904" class="edge-sub">Private Streams &amp; Requery</text>

  <!-- 5. External Venue Private & Order APIs -->
  <rect class="ext-box" x="60" y="924" width="640" height="56" rx="8"/>
  <text x="380" y="948" class="h-ext">Venue Order, Private Stream &amp; REST Snapshot APIs</text>
  <text x="380" y="968" class="sub-ext">WS-API · HTTPS REST Pool · FIX/SBE · Private Executions &amp; Fee Amendments</text>
</svg>
