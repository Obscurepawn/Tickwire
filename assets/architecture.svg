<svg xmlns="http://www.w3.org/2000/svg" width="760" height="918" viewBox="0 0 760 918"
     role="img" aria-labelledby="title description">
  <title id="title">Tickwire institutional single-host multi-process ORS architecture</title>
  <desc id="description">A market-data process decodes public venue feeds once into a memfd-sealed shared-memory broadcast ring, fanning normalized records out to supervised strategy workers and a direct freshness gate to the account process. Strategy workers exchange SPSC New, Modify, and Cancel intents plus ordered reports and ProjectedFill updates with one single-writer account process, where fixed-point holds and a lock-free StpBook feed a selectable SelfDescribingClientId commit profile (InMemory default, MmapAsync, or fsync WAL) and an execution gate with first-byte grant rechecks, an EWMA OrderRouter pool, and per-IP Order, Cancel, and Query rate limiters, backed off-thread by non-blocking DNS and dialing plus a per-order QueryDesk across pooled multi-IP REST and 16-way WebSocket trading connections.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="#4f46e5"/>
    </marker>
    <style>
      text { font-family: "Inter", "Segoe UI", "DejaVu Sans", sans-serif; text-anchor: middle; }
      .h-ext { font-size: 17.5px; font-weight: 700; fill: #f8fafc; }
      .sub-ext { font-size: 14px; fill: #cbd5e1; }
      .h-proc { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sub-proc { font-size: 14px; fill: #475569; }
      .h-mod { font-size: 15.5px; font-weight: 700; fill: #0f172a; }
      .h-async { font-size: 15.2px; font-weight: 700; fill: #312e81; }
      .sub-mod { font-size: 13.8px; fill: #334155; }
      .sub-mod-sm { font-size: 13.6px; fill: #334155; }
      .ring-lbl { font-size: 15px; font-weight: 700; fill: #115e59; }
      .edge-lbl { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .edge-blue { font-size: 13.8px; font-weight: 700; fill: #1e3a8a; }
      .edge-sub { font-size: 13.6px; fill: #334155; }
      .edge-teal { font-size: 13.8px; font-weight: 600; fill: #0f766e; }
      .ext-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1.6; }
      .proc-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .shm-box { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; stroke-dasharray: 6 3; }
      .mod-risk { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; }
      .mod-wal { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
      .mod-gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .mod-async { fill: #f5f3ff; stroke: #6366f1; stroke-width: 1.8; stroke-dasharray: 6 3.5; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .pill-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.3; }
      .pill-teal { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.3; }
      .wire-slate { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-teal { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-teal-dash { fill: none; stroke: #0f766e; stroke-width: 2.1; stroke-dasharray: 5 4; stroke-linejoin: round; }
      .wire-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-linejoin: round; }
      .wire-async { fill: none; stroke: #4f46e5; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="760" height="918" rx="10" fill="#ffffff"/>

  <!-- 1. External Venue Public Feeds -->
  <rect class="ext-box" x="160" y="16" width="440" height="58" rx="8"/>
  <text x="380" y="40" class="h-ext">Venue Public Feeds</text>
  <text x="380" y="61" class="sub-ext">WebSocket · HTTPS Snapshot · Spot SBE</text>

  <path class="wire-slate" d="M380 74 V111" marker-end="url(#arrow-slate)"/>
  <rect class="pill" x="394" y="81" width="136" height="26" rx="13"/>
  <text x="462" y="99" class="edge-lbl">Native frames</text>

  <!-- 2. Market-Data Process -->
  <rect class="proc-box" x="76" y="114" width="608" height="122" rx="8"/>
  <text x="380" y="141" class="h-proc">Market-Data Process</text>
  <text x="380" y="163" class="sub-proc">Single-writer tick/lot decode · sequence continuity · JOIN baseline</text>
  <rect class="shm-box" x="100" y="176" width="560" height="46" rx="6"/>
  <text x="380" y="204" class="ring-lbl">Sealed SPMC Shared-Memory Ring (memfd + snapshot)</text>

  <!-- Fan-out from SHM Ring to Workers + Direct Freshness Gate to Account -->
  <path class="wire-teal" d="M168 222 V299" marker-end="url(#arrow-teal)"/>
  <path class="wire-teal" d="M482 222 V299" marker-end="url(#arrow-teal)"/>
  <path class="wire-teal-dash" d="M660 199 H692 V493" marker-end="url(#arrow-teal)"/>

  <rect class="pill-teal" x="203" y="250" width="244" height="28" rx="14"/>
  <text x="325" y="269" class="edge-teal">Normalized records · JOIN</text>

  <!-- 3. Supervised Strategy Workers + Freshness Badge -->
  <rect class="proc-box" x="18" y="302" width="300" height="108" rx="8"/>
  <text x="168" y="332" class="h-proc">Strategy Worker A</text>
  <text x="168" y="357" class="sub-proc">Market replica · Cursor A</text>
  <text x="168" y="380" class="sub-proc">Sealed ELF · cgroup v2</text>

  <rect class="proc-box" x="332" y="302" width="300" height="108" rx="8"/>
  <text x="482" y="332" class="h-proc">Strategy Worker B</text>
  <text x="482" y="357" class="sub-proc">Market replica · Cursor B</text>
  <text x="482" y="380" class="sub-proc">Sealed ELF · cgroup v2</text>

  <rect class="pill-teal" x="640" y="334" width="104" height="46" rx="8"/>
  <text x="692" y="353" class="edge-teal">Freshness</text>
  <text x="692" y="372" class="edge-teal">gate</text>

  <!-- Bidirectional SPSC Intents & Reports + ProjectedFill -->
  <path class="wire-blue" d="M102 410 V493" marker-end="url(#arrow-blue)"/>
  <path class="wire-slate" d="M256 496 V413" marker-end="url(#arrow-slate)"/>
  <path class="wire-blue" d="M416 410 V493" marker-end="url(#arrow-blue)"/>
  <path class="wire-slate" d="M570 496 V413" marker-end="url(#arrow-slate)"/>

  <rect class="pill-blue" x="18" y="431" width="168" height="44" rx="8"/>
  <text x="102" y="449" class="edge-blue">SPSC Intents</text>
  <text x="102" y="467" class="edge-sub">New · Modify · Cancel</text>

  <rect class="pill" x="194" y="431" width="124" height="44" rx="8"/>
  <text x="256" y="449" class="edge-lbl">Reports +</text>
  <text x="256" y="467" class="edge-sub">ProjectedFill</text>

  <rect class="pill-blue" x="332" y="431" width="168" height="44" rx="8"/>
  <text x="416" y="449" class="edge-blue">SPSC Intents</text>
  <text x="416" y="467" class="edge-sub">New · Modify · Cancel</text>

  <rect class="pill" x="508" y="431" width="124" height="44" rx="8"/>
  <text x="570" y="449" class="edge-lbl">Reports +</text>
  <text x="570" y="467" class="edge-sub">ProjectedFill</text>

  <!-- 4. Account Process (Single-Writer Risk Domain & Institutional ORS) -->
  <rect class="proc-box" x="16" y="496" width="728" height="270" rx="10"/>
  <text x="380" y="524" class="h-proc">Account Process</text>
  <text x="380" y="546" class="sub-proc">Single-Writer Risk Domain &amp; Institutional ORS · Strategy Host &amp; Gateway</text>

  <!-- Stage 1: Order Manager & Risk -->
  <rect class="mod-risk" x="30" y="560" width="340" height="86" rx="6"/>
  <text x="200" y="585" class="h-mod">1 · Order Manager &amp; Risk</text>
  <text x="200" y="608" class="sub-mod">Fixed-point holds · Lock-free StpBook</text>
  <text x="200" y="629" class="sub-mod">Native Modify &amp; ProjectedFill</text>

  <path class="wire-slate" d="M370 603 H387" marker-end="url(#arrow-slate)"/>

  <!-- Stage 2: Selectable Commit Profile -->
  <rect class="mod-wal" x="390" y="560" width="340" height="86" rx="6"/>
  <text x="560" y="585" class="h-mod">2 · Selectable Commit Profile</text>
  <text x="560" y="608" class="sub-mod">SelfDescribingClientId (tw1...)</text>
  <text x="560" y="629" class="sub-mod-sm">InMemory (default) · MmapAsync · fsync WAL</text>

  <!-- Hot-path 2->3 down-arrow & Off-thread->1 resolution arrow -->
  <path class="wire-slate" d="M560 646 V663" marker-end="url(#arrow-slate)"/>
  <path class="wire-async" d="M200 666 V649" marker-end="url(#arrow-indigo)"/>

  <!-- Off-Thread Background Actors (Decoupled Dashed Lane) -->
  <rect class="mod-async" x="30" y="666" width="340" height="86" rx="6"/>
  <text x="200" y="691" class="h-async">Off-Thread Background Actors</text>
  <text x="200" y="714" class="sub-mod">Non-blocking Dialer &amp; DNS</text>
  <text x="200" y="735" class="sub-mod">Per-order QueryDesk (AsyncRestQuerier)</text>

  <path class="wire-async" d="M370 709 H387" marker-end="url(#arrow-indigo)"/>

  <!-- Stage 3: Execution Gate & Router -->
  <rect class="mod-gate" x="390" y="666" width="340" height="86" rx="6"/>
  <text x="560" y="691" class="h-mod">3 · Execution Gate &amp; Router</text>
  <text x="560" y="714" class="sub-mod">First-byte recheck · EWMA OrderRouter pool</text>
  <text x="560" y="735" class="sub-mod">Per-IP RateLimiter (Order | Cancel | Query)</text>

  <!-- Multi-Path Venue Order & Private I/O -->
  <path class="wire-blue" d="M230 766 V841" marker-end="url(#arrow-blue)"/>
  <path class="wire-slate" d="M530 844 V769" marker-end="url(#arrow-slate)"/>

  <rect class="pill-blue" x="114" y="783" width="232" height="44" rx="8"/>
  <text x="230" y="801" class="edge-blue">Pooled REST multi-IP</text>
  <text x="230" y="819" class="edge-sub">16-way WS Trading mux</text>

  <rect class="pill" x="418" y="783" width="224" height="44" rx="8"/>
  <text x="530" y="801" class="edge-lbl">Acks · Fills</text>
  <text x="530" y="819" class="edge-sub">Async Requery</text>

  <!-- 5. External Venue Order & Private APIs -->
  <rect class="ext-box" x="120" y="844" width="520" height="58" rx="8"/>
  <text x="380" y="868" class="h-ext">Venue Order &amp; Private APIs</text>
  <text x="380" y="889" class="sub-ext">REST Pool · WebSocket Trading · Private Streams</text>
</svg>
