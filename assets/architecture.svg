<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510"
     role="img" aria-labelledby="title description">
  <title id="title">From market data to two strategy workers and one trading account</title>
  <desc id="description">A market-data process decodes a venue's public feed once. Two workers read its shared-memory ring at independent cursors. Each can send intents to the same account process and receive account reports. The account owns risk, the order journal and the connection to the venue's order API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#365469"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #172c3d; text-anchor: middle }
      .name { font-size: 20px; font-weight: bold }
      .detail, .edge { font-size: 18px }
      .detail { fill: #304d60 }
      .box { fill: #edf5fa; stroke: #6c8798; stroke-width: 1.5 }
      .path { fill: none; stroke: #365469; stroke-width: 2; stroke-linejoin: round }
    </style>
  </defs>
  <rect width="480" height="510" rx="8" fill="#fff"/>
  <text x="240" y="27" class="name">Venue public feed</text>
  <path class="path" d="M240 37V72" marker-end="url(#arrow)"/>
  <text x="320" y="60" class="edge">Native frames</text>

  <rect class="box" x="89" y="74" width="302" height="64" rx="6"/>
  <text x="240" y="100" class="name">Market-data process</text>
  <text x="240" y="124" class="detail">Shared-memory market ring</text>
  <path class="path" d="M240 138V180M122 180H358"/>
  <path class="path" d="M358 180V202" marker-end="url(#arrow)"/>
  <path class="path" d="M122 180V202" marker-end="url(#arrow)"/>
  <text x="137" y="163" class="edge">Normalized records</text>

  <rect class="box" x="10" y="204" width="224" height="68" rx="6"/>
  <rect class="box" x="246" y="204" width="224" height="68" rx="6"/>
  <text x="122" y="231" class="name">Strategy worker A</text>
  <text x="358" y="231" class="name">Strategy worker B</text>
  <text x="122" y="256" class="detail">Market view · cursor A</text>
  <text x="358" y="256" class="detail">Market view · cursor B</text>

  <path class="path" d="M315 272V339" marker-end="url(#arrow)"/>
  <path class="path" d="M80 272V339" marker-end="url(#arrow)"/>
  <path class="path" d="M400 341V274" marker-end="url(#arrow)"/>
  <path class="path" d="M165 341V274" marker-end="url(#arrow)"/>
  <g class="edge" style="paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round">
    <text x="80" y="313">Intents</text><text x="165" y="313">Reports</text>
    <text x="315" y="313">Intents</text><text x="400" y="313">Reports</text>
  </g>
  <rect class="box" x="10" y="342" width="460" height="72" rx="6"/>
  <text x="240" y="372" class="name">Account process</text>
  <text x="240" y="398" class="detail">Risk checks · order journal · venue adapter</text>

  <path class="path" d="M110 414V469" marker-end="url(#arrow)"/>
  <path class="path" d="M363 471V416" marker-end="url(#arrow)"/>
  <g class="edge" style="paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round">
    <text x="110" y="451">Signed requests</text>
    <text x="363" y="451">Order updates · fills</text>
  </g>
  <text x="240" y="495" class="name">Venue order and private APIs</text>
</svg>
