tick_ms = 10
heartbeat_ms = 50
election_min_ms = 500
election_max_ms = 1000
pre_vote = true
check_quorum = true
read_only_mode = "Safe"
exec_grant_lifetime_ms = 100
exec_grant_renew_ms = 25
strategy_grant_lifetime_ms = 60000
strategy_progress_interval_ms = 10
strategy_suspect_after_ms = 50
mtls_identity_ref = "REQUIRED:/control/mtls_identity_ref"
client_ca_bundle_ref = "REQUIRED:/control/client_ca_bundle_ref"
operation_timeout_ms = 120000
plan_ttl_ms = 60000
idempotency_retention_days = 90
max_request_bytes = 4194304

[[control.role_bindings]]
subject = "REQUIRED:/control/role_bindings/0/subject"
role = "viewer"
account_ids = [
    "spot-main",
    "usdm-main",
]

[[control.role_bindings]]
subject = "REQUIRED:/control/role_bindings/1/subject"
role = "config-editor"
account_ids = [
    "spot-main",
    "usdm-main",
]

[[control.role_bindings]]
subject = "REQUIRED:/control/role_bindings/2/subject"
role = "config-operator"
account_ids = [
    "spot-main",
    "usdm-main",
]

[[control.role_bindings]]
subject = "REQUIRED:/control/role_bindings/3/subject"
role = "risk-admin"
account_ids = [
    "spot-main",
    "usdm-main",
]

[[control.role_bindings]]
subject = "REQUIRED:/control/role_bindings/4/subject"
role = "cluster-admin"
account_ids = []

[local_config]
root_dir = "/var/lib/tickwire/config"
file_mode = "0600"
directory_mode = "0700"
owner = "tickwire-config"
retain_last_good = 2
durability = "fsync-file-rename-fsync-directory"
manual_edit_policy = "quarantine-and-reconcile"
startup_policy = "journal-verified-effective-then-reconcile"
strict_drift_gate = true
journal_max_bytes = 268435456
projection_policy_revision = 1
projection_policy_ref = "REQUIRED:/local_config/projection_policy_ref"
bootstrap_locator_path = "/etc/tickwire/bootstrap/config-locator.toml"

[observability]
metrics_listen_uri = "REQUIRED:/observability/metrics_listen_uri"
metrics_identity_ref = "REQUIRED:/observability/metrics_identity_ref"
diagnostic_level = "info"
sample_per_million = 1000
histogram_profile_ref = "REQUIRED:/observability/histogram_profile_ref"
audit_root_dir = "/var/lib/tickwire/audit"
audit_retention_days = 90
secret_redaction = true
labels_policy = "bounded-no-secrets-no-order-id"
log_max_bytes = 4294967296

[timeouts]
intent_ttl_us = 5000
private_stream_stale_ms = 5000
clock_max_offset_us = 1000
quiesce_timeout_ms = 30000
shutdown_timeout_ms = 60000
unknown_order_query_ms = 1000
reconnect_min_ms = 100
reconnect_max_ms = 30000
fencing_deadline_ms = 5000
takeover_deadline_ms = 30000

[qualification]
deployment_manifest_ref = "REQUIRED:/qualification/deployment_manifest_ref"
protocol_entitlements_ref = "REQUIRED:/qualification/protocol_entitlements_ref"
host_inventory_ref = "REQUIRED:/qualification/host_inventory_ref"
storage_power_loss_report_ref = "REQUIRED:/qualification/storage_power_loss_report_ref"
network_isolation_report_ref = "REQUIRED:/qualification/network_isolation_report_ref"
risk_acceptance_ref = "REQUIRED:/qualification/risk_acceptance_ref"
full_send_p99_us = 300
full_send_p999_us = 1000
sync_send_p99_us = 2000
sync_send_p999_us = 5000
