[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[profile.bench]
overflow-checks = true
