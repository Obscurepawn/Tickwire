[workspace]
members = [
    "crates/tickwire-account",
    "crates/tickwire-account-codec",
    "crates/tickwire-account-gateway",
    "crates/tickwire-binance",
    "crates/tickwire-binance-account",
    "crates/tickwire-binance-clock",
    "crates/tickwire-binance-execution",
    "crates/tickwire-binance-private",
    "crates/tickwire-binance-public",
    "crates/tickwire-binance-quota",
    "crates/tickwire-binance-sbe",
    "crates/tickwire-binance-session",
    "crates/tickwire-book",
    "crates/tickwire-clock",
    "crates/tickwire-clock-sys",
    "crates/tickwire-config",
    "crates/tickwire-control",
    "crates/tickwire-control-sys",
    "crates/tickwire-instrument-catalog",
    "crates/tickwire-instrument-index",
    "crates/tickwire-ipc",
    "crates/tickwire-join",
    "crates/tickwire-market-publisher",
    "crates/tickwire-market-source",
    "crates/tickwire-md",
    "crates/tickwire-quota",
    "crates/tickwire-risk",
    "crates/tickwire-runtime",
    "crates/tickwire-runtime-policy",
    "crates/tickwire-shm",
    "crates/tickwire-shm-sys",
    "crates/tickwire-snapshot",
    "crates/tickwire-strategy-example",
    "crates/tickwire-strategy-host",
    "crates/tickwire-strategy-sdk",
    "crates/tickwire-supervisor",
    "crates/tickwire-transport",
    "crates/tickwire-venue",
]
exclude = [
    "crates/tickwire-app",
    "crates/tickwire-lab",
    "crates/tickwire-spot-execution",
    "crates/tickwire-spot-runner",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[profile.bench]
overflow-checks = true
