[package]
name = "tickwire-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-poll"] }
tickwire-account = { path = "../tickwire-account" }
tickwire-account-gateway = { path = "../tickwire-account-gateway" }
tickwire-clock = { path = "../tickwire-clock" }
tickwire-clock-sys = { path = "../tickwire-clock-sys" }
tickwire-control = { path = "../tickwire-control" }
tickwire-control-sys = { path = "../tickwire-control-sys" }
tickwire-instrument-catalog = { path = "../tickwire-instrument-catalog" }
tickwire-ipc = { path = "../tickwire-ipc" }
tickwire-quota = { path = "../tickwire-quota" }
tickwire-risk = { path = "../tickwire-risk" }
tickwire-runtime-policy = { path = "../tickwire-runtime-policy" }
tickwire-shm = { path = "../tickwire-shm" }
tickwire-strategy-sdk = { path = "../tickwire-strategy-sdk" }
tickwire-transport = { path = "../tickwire-transport" }
tickwire-venue = { path = "../tickwire-venue" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "=0.10.9"
tickwire-strategy-host = { path = "../tickwire-strategy-host" }

[features]
default = []
crc32 = [
    "tickwire-ipc/crc32",
    "tickwire-shm/crc32",
    "tickwire-control/crc32",
    "tickwire-control-sys/crc32",
    "tickwire-strategy-sdk/crc32",
]
