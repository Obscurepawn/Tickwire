[package]
name = "tickwire-spot-runner"
description = "Shared spot strategy intake and local Bybit and OKX execution profile"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "=0.22.1"
rcgen = "=0.14.10"
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tickwire-account = { path = "../tickwire-account" }
tickwire-account-codec = { path = "../tickwire-account-codec" }
tickwire-account-gateway = { path = "../tickwire-account-gateway" }
tickwire-account-journal = { path = "../tickwire-account-journal" }
tickwire-app = { path = "../tickwire-app" }
tickwire-binance-clock = { path = "../tickwire-binance-clock" }
tickwire-clock = { path = "../tickwire-clock" }
tickwire-gateway = { path = "../tickwire-gateway" }
tickwire-market-source = { path = "../tickwire-market-source" }
tickwire-journal = { path = "../tickwire-journal" }
tickwire-recovery = { path = "../tickwire-recovery" }
tickwire-runtime = { path = "../tickwire-runtime" }
tickwire-runtime-policy = { path = "../tickwire-runtime-policy" }
tickwire-spot-execution = { path = "../tickwire-spot-execution" }
tickwire-transport = { path = "../tickwire-transport" }
tickwire-venue = { path = "../tickwire-venue" }

[dev-dependencies]
tickwire-binance-public = { path = "../tickwire-binance-public" }
tickwire-book = { path = "../tickwire-book" }
