[package]
name = "tickwire-journal"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[features]
default = []
crc32 = []

[dependencies]
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
