tickwire-account = { path = "../tickwire-account" }
tickwire-account-codec = { path = "../tickwire-account-codec" }
tickwire-account-journal = { path = "../tickwire-account-journal" }
tickwire-app = { path = "../tickwire-app" }
tickwire-binance-quota = { path = "../tickwire-binance-quota" }
tickwire-clock = { path = "../tickwire-clock" }
tickwire-clock-sys = { path = "../tickwire-clock-sys" }
tickwire-fencing = { path = "../tickwire-fencing" }
tickwire-lifecycle = { path = "../tickwire-lifecycle" }
tickwire-ipc = { path = "../tickwire-ipc" }
tickwire-shm = { path = "../tickwire-shm" }
tickwire-market-source = { path = "../tickwire-market-source" }
tickwire-md = { path = "../tickwire-md" }
tickwire-recovery = { path = "../tickwire-recovery" }
tickwire-release = { path = "../tickwire-release" }
tickwire-replica = { path = "../tickwire-replica" }
tickwire-runtime-policy = { path = "../tickwire-runtime-policy" }
tickwire-strategy-sdk = { path = "../tickwire-strategy-sdk" }
tickwire-transport = { path = "../tickwire-transport" }
