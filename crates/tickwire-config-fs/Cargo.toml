[package]
name = "tickwire-config-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
getrandom = "=0.2.17"
tickwire-journal = { path = "../tickwire-journal" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

# Audited descriptor-relative OS boundary; other crates keep forbid(unsafe_code).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
